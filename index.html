<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <!-- Цвет системной полосы = фактический цвет стекла шапки (замерен с
         отрисованной страницы), чтобы полоса и шапка выглядели одним слоем.
         Обновляется из App.tsx при смене темы. -->
    <meta name="theme-color" content="#fdfeff" />
    <meta name="description" content="Manage installments with AI" />

    <script>
      (function () {
        try {
          var mode = localStorage.getItem('finuchet_theme_mode') || 'system';
          var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#18243b');
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">

    <!-- iOS. Safari до 16.4 не читает display из манифеста: без этих тегов приложение,
         добавленное на экран «Домой», открывалось в браузере с адресной строкой,
         а не во весь экран. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FinUchet">
    <!-- Полупрозрачная строка состояния под цвет шапки приложения -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Prevent Caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>FinUchet</title>

    <!-- 🔹 СПЛЕШ-ЭКРАН.
         Стили лежат здесь, а не в бандле, намеренно: экран должен появиться в первом
         же кадре, до загрузки CSS и JS. Те же классы использует React-компонент
         components/SplashScreen.tsx — благодаря этому при передаче эстафеты от
         статической разметки к React картинка не перерисовывается и логотип не
         проигрывает анимацию появления второй раз. Раньше стили были скопированы
         в двух местах и уже начали расходиться. -->
    <style>
      .splash-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        /* 100vh на мобильных считается вместе со свёрнутой адресной строкой, из-за чего
           экран оказывается выше видимой области. dvh учитывает реальную высоту. */
        height: 100vh;
        height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: linear-gradient(160deg, #ffffff 0%, #f1f5f9 55%, #e8ecf6 100%);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 0.45s ease, visibility 0.45s;
      }

      .dark .splash-screen {
        background: linear-gradient(160deg, #0b0f1a 0%, #111827 60%, #0b0f1a 100%);
      }

      .splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      /* Логотип подаём как иконку приложения — скруглённым квадратом, а не кругом.
         Раньше стоял border-radius: 55%, который и кругом не является, и срезал углы
         самой картинки. Скруглённый квадрат совпадает с тем, как иконка выглядит на
         рабочем столе телефона, поэтому запуск читается как продолжение нажатия по ней. */
      .splash-logo {
        width: clamp(84px, 22vw, 104px);
        height: clamp(84px, 22vw, 104px);
        border-radius: 24%;
        object-fit: cover;
        display: block;
        box-shadow:
          0 12px 32px -8px rgba(30, 58, 138, 0.45),
          0 0 0 1px rgba(255, 255, 255, 0.12) inset;
        animation: splash-rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .splash-title {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #0f172a;
        animation: splash-rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
      }
      .dark .splash-title { color: #f8fafc; }

      .splash-subtitle {
        margin: 6px 0 0;
        font-size: 13px;
        font-weight: 400;
        color: #64748b;
        animation: splash-rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.14s both;
      }
      .dark .splash-subtitle { color: #94a3b8; }

      /* Индикатор загрузки без процентов: реальный прогресс здесь неизвестен, а
         поддельная шкала, замирающая на 90%, выглядит хуже честной бесконечной. */
      .splash-progress {
        position: relative;
        width: 132px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(15, 23, 42, 0.08);
        animation: splash-fade 0.5s ease 0.25s both;
      }
      .dark .splash-progress { background: rgba(255, 255, 255, 0.1); }

      /* Два сегмента с разными таймингами, как в Material. Один бегунок оставлял
         паузы: пока он уезжал за правый край и не появился слева, полоса выглядела
         пустой примерно треть цикла — как будто загрузка встала. */
      .splash-progress::before,
      .splash-progress::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #4f46e5, #6366f1);
      }
      .splash-progress::before {
        width: 55%;
        animation: splash-bar-a 2.1s cubic-bezier(0.65, 0.82, 0.74, 0.4) infinite;
      }
      .splash-progress::after {
        width: 35%;
        animation: splash-bar-b 2.1s cubic-bezier(0.17, 0.84, 0.44, 1) 1.05s infinite;
      }

      .splash-version {
        position: absolute;
        bottom: max(20px, env(safe-area-inset-bottom));
        font-size: 11px;
        letter-spacing: 0.04em;
        color: #94a3b8;
        animation: splash-fade 0.5s ease 0.35s both;
      }
      .dark .splash-version { color: #475569; }

      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(8px) scale(0.98); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes splash-fade {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes splash-bar-a {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(240%); }
      }
      @keyframes splash-bar-b {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(380%); }
      }

      /* Появление логотипа проигрывается один раз — при первой отрисовке. React-версия
         показывается уже «на месте», иначе при передаче эстафеты логотип дёргался повторно. */
      .splash-screen--settled .splash-logo,
      .splash-screen--settled .splash-title,
      .splash-screen--settled .splash-subtitle,
      .splash-screen--settled .splash-progress,
      .splash-screen--settled .splash-version {
        animation-name: none;
        opacity: 1;
        transform: none;
      }
      /* Сама бегущая полоса продолжает двигаться и в React-версии — она показывает,
         что приложение живо, а не подвисло. Сброс касается только появления блоков. */
      .splash-screen--settled .splash-progress::before { animation-name: splash-bar-a; }
      .splash-screen--settled .splash-progress::after  { animation-name: splash-bar-b; }

      @media (prefers-reduced-motion: reduce) {
        .splash-logo, .splash-title, .splash-subtitle, .splash-progress, .splash-version {
          animation: splash-fade 0.2s ease both;
        }
        /* Без движения: ровная приглушённая заливка вместо бегунков */
        .splash-progress::before { animation: none; width: 100%; opacity: 0.45; }
        .splash-progress::after  { display: none; }
      }
    </style>
  </head>

  <body>
    <!-- Виден в первом кадре, до загрузки бандла. Убирается из App.tsx, когда
         приложение готово; те же классы затем отрисовывает SplashScreen.tsx. -->
    <div id="static-splash" class="splash-screen">
      <div class="splash-brand">
        <img src="/splash.png" alt="" class="splash-logo" width="104" height="104" />
        <div style="text-align: center;">
          <h1 class="splash-title">FinUchet</h1>
          <p class="splash-subtitle">Учёт рассрочек и платежей</p>
        </div>
      </div>
      <div class="splash-progress" role="progressbar" aria-label="Загрузка приложения"></div>
      <!-- Подставляется на сборке из APP_VERSION в constants.tsx
           (плагин inject-app-version в vite.config.ts) -->
      <span class="splash-version">{{APP_VERSION}}</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
